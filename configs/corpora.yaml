# stage 2 corpus build: the sdf arm's mix plus the token-matched replay-only control (no_sdf).
# run: python pipelines/build_corpora.py configs/corpora.yaml [--sanity]
# outputs data/<out_dir>/<arm>_mix.jsonl, consumed by configs/sdf/<arm>_seed<k>.yaml.
# every arm shares the same replay documents in the same order.

# framing: the washout paper (arXiv:2604.13076) trained on pure synthetic docs with no replay
# and their effect died after ~5k sft samples. replay is the cheapest protection the forgetting
# literature supports (arXiv:2406.11813: verbatim-ish synthetic-only is forgotten fastest), and
# it is one of the recipe axes they never tested. so the 1:1 mix stays even though our corpus
# is small. the q&a split stays out of sdf, that is instruction data and it belongs to stage 3
# if anywhere.

tokenizer: Qwen/Qwen3-8B
cap_tokens_per_doc: 2048   # replay documents are truncated to this many tokens
replay_ratio: 1.0          # replay tokens per charter token (upstream recipe: 1:1)
reference_arm: sdf         # the control is length-matched doc-by-doc to this arm's corpus
control_arm: no_sdf
out_dir: sdf_vs_no_sdf     # under data/

replay:
  repo: HuggingFaceFW/fineweb-edu
  name: sample-10BT
  split: train
  text_field: text
  min_chars: 300

arms:
  sdf:                     # animal welfare charter documents (treatment)
    sources:
      - repo: sentientfutures/animal-welfare-training-claude
        name: synthetic documents                    # 477 pretraining-style docs
        revision: d5d60c85cf575e2ccae7497bf95a7508a8f9b1c0
        split: train
        text_field: content
        # max_docs: null                             # optional cap per source
      # held out of sdf: q&a pairs are instruction-format (sft-like), not pretraining-style
      # - repo: sentientfutures/animal-welfare-training-claude
      #   name: difficult advice Q&A                 # 1324 q&a pairs, rendered as advice documents
      #   revision: d5d60c85cf575e2ccae7497bf95a7508a8f9b1c0
      #   split: train
      #   text_template: "{user_prompt}\n\n{assistant_response}"
