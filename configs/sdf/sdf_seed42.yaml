# stage 2 SDF: full-weight mid-training of the base model on the sdf arm's mix
# (built by pipelines/build_corpora.py from configs/corpora.yaml).
# run from the repo root: axolotl train configs/sdf/sdf_seed42.yaml
# sanity: axolotl preprocess configs/sdf/sdf_seed42.yaml (tokenizes and validates, no training)
# framing: we only have ~477 docs and are not generating more, so we trade uniqueness for
# exposure. 3 epochs puts effective charter tokens at ~3-4M, the same ballpark as the run
# that worked in arXiv:2604.13076 (2 epochs over 3M), and exposure/diversity mattered more
# than unique doc count in every ablation we found (arXiv:2309.00667). 8B base because SDF
# works down to ~1B (arXiv:2510.17941 app D) but small models get sloppy at distinguishing
# and keeping unrelated beliefs intact, and our evals lean on exactly that. base-first +
# full-weight + replay is the recipe the washout paper never tested. that is the experiment.
base_model: Qwen/Qwen3-8B-Base
tokenizer_config: Qwen/Qwen3-8B
special_tokens:
  pad_token: "<|endoftext|>"
  eos_token: "<|im_end|>"
load_in_8bit: false
bf16: true
tf32: true

datasets:
  - path: data/sdf_vs_no_sdf/sdf_mix.jsonl
    type: completion
    field: text
dataset_prepared_path: data/.axolotl-prepared-cache

sequence_len: 2048
sample_packing: false
flash_attention: false
sdp_attention: true

micro_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: false
num_epochs: 3
learning_rate: 1e-5
optimizer: adamw_bnb_8bit
lr_scheduler: cosine
warmup_ratio: 0.05
weight_decay: 0.01
max_grad_norm: 1.0
seed: 42

output_dir: data/sdf_vs_no_sdf/models/sdf-seed42-mid
# pods are ephemeral, so the push is part of the run. axolotl forces the repo private.
hub_model_id: markstanl/qwen3-8b-sdf-seed42-mid
hub_strategy: end
save_strategy: "no"
save_only_model: true
auto_resume_from_checkpoints: false
logging_steps: 10
use_wandb: false
